name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test + coverage
        run: flutter test --coverage

      - name: App flows (headless)
        run: flutter test integration_test -d flutter-tester

      - name: Filter coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info \
            '*.g.dart' \
            '*/services/location/location_service.dart' \
            '*/maps/maps_launcher.dart' \
            '*/services/channel/ws_channel_socket.dart' \
            -o coverage/lcov.info
          lcov --summary coverage/lcov.info

      - name: Coverage gate (min 70%)
        run: |
          PCT=$(lcov --summary coverage/lcov.info 2>&1 | grep -oP 'lines\.+: \K[0-9.]+')
          echo "coverage: $PCT%"
          awk "BEGIN{exit !($PCT >= 70)}"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
